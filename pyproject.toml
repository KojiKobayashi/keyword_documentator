[project]
name = "boki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.3",
    "google-generativeai>=0.8.5",
    "requests>=2.32.5",
    "streamlit>=1.51.0",
    "taskipy>=1.14.1",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
]

[tool.taskipy.tasks]
run = "uv run --env-file .env"
streamlit = "uv run --env-file .env streamlit run app.py"
